services:
  operator:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8790:8790'
    volumes:
      - ./data:/app/data
      - ./operators:/app/operators
      - ./knowledge:/app/knowledge:ro
    environment:
      TZ: Europe/Moscow
      OPERATOR_SCHEDULER_ENABLED: ${OPERATOR_SCHEDULER_ENABLED:-false}
      OPERATOR_KNOWLEDGE_DIR: /app/knowledge
    shm_size: '1gb'
